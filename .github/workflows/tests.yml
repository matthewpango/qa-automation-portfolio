name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FULL_SUITE: ${{ github.event_name != 'push' || github.ref_name == github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate workflow
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.11 -color

      - name: Build test container
        run: |
          mkdir -p artifacts allure
          docker compose --profile test build tests 2>&1 | tee artifacts/tests-build.log

      - name: Check types, unit and internal integration tests in container
        run: docker compose --profile test run --rm --no-deps tests npm run check 2>&1 | tee artifacts/check.log

      - name: Build and start application
        if: env.FULL_SUITE == 'true'
        run: docker compose up --build -d --wait --wait-timeout 90 2>&1 | tee artifacts/docker-build.log

      - name: Restore Allure history
        if: env.FULL_SUITE == 'true'
        uses: actions/cache/restore@v5
        with:
          path: allure/history.jsonl
          key: allure-history-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: allure-history-${{ github.ref }}-

      - name: Run API and UI tests in container
        if: env.FULL_SUITE == 'true'
        run: docker compose --profile test run --rm tests npm run test:playwright 2>&1 | tee artifacts/playwright.log

      - name: Collect container diagnostics
        if: ${{ !cancelled() && env.FULL_SUITE == 'true' }}
        run: |
          mkdir -p artifacts
          docker compose logs --no-color > artifacts/docker.log 2>&1
          docker compose ps --all > artifacts/docker-status.txt

      - name: Upload test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/
            playwright-report/
            test-results/
            allure/
          retention-days: 14
          if-no-files-found: warn

      - name: Save Allure history
        if: ${{ !cancelled() && env.FULL_SUITE == 'true' && hashFiles('allure/history.jsonl') != '' }}
        uses: actions/cache/save@v5
        with:
          path: allure/history.jsonl
          key: allure-history-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Stop test environment
        if: always()
        run: docker compose --profile test down --remove-orphans
